# ═══════════════════════════════════════════════════════════════════════
#  llwa-site-edge — انتشار استاتیک سه صفحهٔ عمومی روی llwa.infolange.ir
#
#  چرا این Worker وجود دارد؟
#  ────────────────────────
#  سه صفحهٔ لازم برای Google Auth Platform (خانه، حریم خصوصی، قوانین) در
#  `apps/site` هستند و روی Cloudflare Pages مستقر شده‌اند
#  (`llwa-site.pages.dev`). ولی اتصال دامنهٔ اختصاصی به Pages از طریق API
#  رکورد DNS نمی‌سازد — و توکن فعلی مجوز `dns_records:write` ندارد.
#
#  در مقابل، Workers با `custom_domain = true` رکورد DNS را خودش می‌سازد
#  (همان روشی که `api.infolange.ir` را ساخت). پس برای اینکه ساب‌دامین
#  بدون کار دستی کار کند، همان فایل‌های استاتیک را از اینجا سرو می‌کنیم.
#
#  ⚠️ نکتهٔ نگهداری: `apps/site` تنها منبع محتواست. هر دو مقصد (این Worker
#  و پروژهٔ Pages) از همان پوشه تغذیه می‌شوند، پس محتوا دوبار نگه‌داری
#  نمی‌شود.
#
#  ⚠️ اگر بعداً رکورد CNAME را در داشبورد برای Pages اضافه کردید، اول این
#  Worker را حذف کنید (`wrangler delete`)، وگرنه دو سرویس روی یک نام
#  با هم تعارض پیدا می‌کنند.
# ═══════════════════════════════════════════════════════════════════════

name = "llwa-site-edge"
compatibility_date = "2025-10-01"

# بدون اسکریپت سرور — فقط فایل استاتیک
[assets]
directory = "../../apps/site"
# صفحات HTML بدون پسوند هم سرو شوند: /privacy → privacy.html
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[routes]]
pattern = "llwa.infolange.ir"
custom_domain = true
